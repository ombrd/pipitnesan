[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Runs the Laravel task scheduler defined in routes/console.php
; (app:auto-checkout everyMinute, app:send-fcm dailyAt 08:00).
; Remove this program if the host runs its own `* * * * * php artisan schedule:run`
; crontab entry, otherwise scheduled commands will fire twice.
[program:scheduler]
command=/usr/bin/php /var/www/html/artisan schedule:work
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
